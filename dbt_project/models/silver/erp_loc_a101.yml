version: 2

models:
  - name: erp_loc_a101
    description: "Contains ERP customer location information, including customer identifiers and countries of residence."

    config:
      contract:
        enforced: true

    constraints:
      - type: primary_key
        columns: [ cid ]

    columns:
      - name: cid
        data_type: varchar(50)
        description: "Primary key uniquely identifying each customer location record."
        config:
          meta:
            primary_key: true
        data_tests:
          - not_null:
              config:
                tags: ['pk_test']
                severity: error
          - unique:
              config:
                tags: ['pk_test']
                severity: error

      - name: cntry
        data_type: varchar(50)

      - name: dwh_create_ts
        data_type: timestamptz
        description: "Timestamp indicating when the record was loaded into the Data Warehouse."
        data_tests:
          - not_null

      - name: dwh_batch_id
        data_type: varchar(255)
        description: "Identifier of the dbt or Airflow batch that loaded the row."
        data_tests:
          - not_null

      - name: dwh_source_system
        data_type: varchar(50)
        description: "Originating source system; CRM for this model."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [ 'ERP' ]
