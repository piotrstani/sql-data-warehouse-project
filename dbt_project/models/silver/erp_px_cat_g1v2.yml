version: 2
models:
  - name: erp_px_cat_g1v2
    description: "Contains ERP product category information, including categories, subcategories, and maintenance classifications."

    config:
      materialized: table
      contract:
        enforced: true

    constraints:
      - type: primary_key
        columns: [id]

    columns:
      - name: id
        data_type: varchar(50)
        description: "Primary key uniquely identifying each product category record."
        config:
          meta:
            primary_key: true
        data_tests:
          - not_null:
              config:
                tags: ['pk_test']
                severity: error
          - unique:
              config:
                tags: ['pk_test']
                severity: error

      - name: cat
        data_type: varchar(50)
        description: "High-level product category, such as Bikes or Components."

      - name: subcat
        data_type: varchar(50)
        description: "Product subcategory providing a more detailed classification within the main category."

      - name: maintenance
        data_type: varchar(50)
        description: "Indicates whether products in the category require maintenance."

      - name: dwh_create_ts
        data_type: timestamptz
        description: "Timestamp indicating when the record was loaded into the Data Warehouse."
        data_tests:
          - not_null

      - name: dwh_batch_id
        data_type: varchar(255)
        description: "Identifier of the dbt or Airflow batch that loaded the row."
        data_tests:
          - not_null

      - name: dwh_source_system
        data_type: varchar(50)
        description: "Originating source system; CRM for this model."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [ 'ERP' ]
