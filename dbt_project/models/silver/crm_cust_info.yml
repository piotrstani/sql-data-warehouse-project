version: 2
models:
  - name: crm_cust_info
    description: 'Stores customer information'

    config:
      contract:
        enforced: true

    constraints:
      - type: primary_key
        columns: [cst_id]

    data_tests:
      - min_row:
          arguments:
            min_row_cnt: 1000000
      - dbt_expectations.expect_table_row_count_to_equal_other_table:
          arguments:
            compare_model: "source('bronze', 'crm_cust_info')"
          config:
            severity: warn

    columns:
      - name: cst_id
        data_type: int
        description: 'Unique numerical identifier assigned to each customer'
        config:
          meta:
            primary_key: true
        data_tests:
          - not_null:
              config:
                tags: [ 'pk_test' ]
                severity: error
          - unique:
              config:
                tags: [ 'pk_test' ]
                severity: error


      - name: cst_key
        data_type: varchar(50)
        description: 'Alphanumeric identifier representing the customer'
        data_tests:
          - relationships:
              arguments:
                to: ref('erp_cust_az12')
                field: cid
              config:
                severity: warn

      - name: cst_firstname
        data_type: varchar(50)
        description: 'The customer''s first name, as recorded in the system'

      - name: cst_lastname
        data_type: varchar(50)
        description: 'The customer''s last name or family name'
        constraints:
          - type: not_null


      - name: cst_marital_status
        data_type: varchar(50)
        description: 'The marital status of the customer'
        data_tests:
          - accepted_values:
              arguments:
                values: ['Single','Married','n/a']
              config:
                severity: warn

      - name: cst_gndr
        data_type: varchar(50)
        description: 'The gender of the customer'
        data_tests:
          - accepted_values:
              arguments:
                values: [ 'Female','Male','n/a']
              config:
                severity: warn

      - name: cst_create_date
        data_type: date
        description: 'The date and time when the customer record was created in the system'
        data_tests:
          - create_cust_date_test:
              arguments:
                cutoff_date: '2025-10-01'

      - name: dwh_create_ts
        data_type: timestamptz
        description: "Timestamp indicating when the record was loaded into the Data Warehouse."
        data_tests:
          - not_null

      - name: dwh_batch_id
        data_type: varchar(255)
        description: "Identifier of the dbt or Airflow batch that loaded the row."
        data_tests:
          - not_null

      - name: dwh_source_system
        data_type: varchar(50)
        description: "Originating source system; CRM for this model."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [ 'CRM' ]