version: 2
models:
  - name: erp_cust_az12
    description: "Contains ERP customer information, including customer identifiers, birth dates, gender, and Data Warehouse loading timestamps."
    config:
      contract:
        enforced: true

    constraints:
      - type: primary_key
        columns: [ cid ]

    columns:
      - name: cid
        data_type: varchar(50)
        description: "Customer identifier used to associate ERP records with customer data from other source systems."
        config:
          meta:
            primary_key: true
        data_tests:
          - not_null:
              config:
                tags: ['pk_test']
                severity: error
          - unique:
              config:
                tags: ['pk_test']
                severity: error

      - name: bdate
        data_type: date
        description: "Date of birth of the customer."

      - name: gen
        data_type: varchar(50)
        description: "Gender of the customer."

      - name: dwh_create_ts
        data_type: timestamp with time zone
        description: "Timestamp indicating when the record was loaded into the Data Warehouse."
