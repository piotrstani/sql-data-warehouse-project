version: 2
sources:
  - name: bronze
    schema: bronze
    tables:
      - name: cci
        identifier: crm_cust_info
        loaded_at_field: cst_create_date::timestamp
        freshness:
          warn_after: {count: 1, period: day}
          error_after: {count: 5, period: day}
        columns:
          - name: cst_id
            data_type: integer
            description: 'Unique numerical identifier assigned to each customer'
          - name: cst_key
            data_type: varchar(50)
            description: 'Alphanumeric identifier representing the customer'
            data_tests:
              - relationships:
                  arguments:
                    to: ref('erp_cust_az12')
                    field: cid
                  config:
                    severity: warn
      - name: crm_prd_info
      - name: crm_sales_details
        columns:
          - name: sls_price
            data_tests:
              - dbt_expectations.expect_column_quantile_values_to_be_between:
                  quantile: .95
                  min_value: 0
                  max_value: 200
      - name: erp_cust_az12
      - name: erp_loc_a101
      - name: erp_px_cat_g1v2