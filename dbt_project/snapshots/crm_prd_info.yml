version: 2

snapshots:
  - name: crm_prd_info
    description: "Historical CRM product information maintained using SCD Type 2, including product attributes, categories, costs, and validity periods."

    columns:
      - name: prd_id
        data_type: integer
        description: "Product identifier used as the unique key for detecting changes between successive snapshots."
        meta:
          business_key: true
          snapshot_unique_key: true
        data_tests:
          - not_null:
              config:
                tags: ['pk_test']
                severity: error

      - name: cat_id
        data_type: varchar(50)
        description: "Product category identifier referencing ERP product category information."
        data_tests:
          - relationships:
              arguments:
                to: ref('erp_px_cat_g1v2')
                field: id
              config:
                tags: ['fk_test']
                severity: warn

      - name: prd_key
        data_type: varchar(50)
        description: "Product business key used to associate products with sales transactions."

      - name: prd_nm
        data_type: varchar(50)
        description: "Descriptive name of the product."

      - name: prd_cost
        data_type: integer
        description: "Cost of the product expressed in monetary units."

      - name: prd_line
        data_type: varchar(50)
        description: "Product line or business classification."

      - name: prd_start_dt
        data_type: date
        description: "Business effective start date of the product record."

      - name: prd_end_dt
        data_type: date
        description: "Business effective end date of the product record. NULL indicates an active business record."

      # dbt-managed SCD Type 2 metadata

      - name: dbt_scd_id
        data_type: text
        description: "Unique identifier generated by dbt for each historical version of a product record."
        meta:
          primary_key: true
        data_tests:
          - not_null:
              config:
                tags: ['pk_test']
                severity: error
          - unique:
              config:
                tags: ['pk_test']
                severity: error

      - name: dbt_updated_at
        description: "Timestamp used by dbt to record when a snapshot version was detected."

      - name: dbt_valid_from
        description: "Timestamp when the snapshot version became valid."
        data_tests:
          - not_null:
              config:
                tags: ['scd2_test']
                severity: error

      - name: dbt_valid_to
        description: "Timestamp when the snapshot version ceased to be valid. NULL indicates the current snapshot version."
