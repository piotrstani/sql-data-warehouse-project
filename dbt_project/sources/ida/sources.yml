version: 2
sources:
  - name: bronze
    schema: bronze
    tables:
      - name: crm_cust_info
        identifier: crm_cust_info
        loaded_at_field: cst_create_date::timestamp
        freshness:
          warn_after: {count: 1, period: day}
          error_after: {count: 5, period: day}
        columns:
          - name: cst_id
            data_type: integer
            description: 'Unique numerical identifier assigned to each customer'
          - name: cst_key
            data_type: varchar(50)
            description: 'Alphanumeric identifier representing the customer'
            data_tests:
              - relationships:
                  arguments:
                    to: ref('erp_cust_az12', v=1)
                    field: cid
                  config:
                    severity: warn
      - name: crm_prd_info
        identifier: crm_prd_info
      - name: crm_sales_details
        identifier: crm_sales_details
        columns:
          - name: sls_price
            data_tests:
              - dbt_expectations.expect_column_quantile_values_to_be_between:
                  arguments:
                    quantile: .95
                    min_value: 0
                    max_value: 200
                  config:
                    severity: warn
      - name: erp_cust_az12
        identifier: erp_cust_az12
        data_tests:
          - dbt_utils.equality:
              arguments:
                # Wskazujesz tabelę/model referencyjny do porównania
                compare_model: "ref('erp_cust_az12', v=1)"
                # Wskazujesz tylko te kolumny, których wartości chcesz sprawdzić
                compare_columns:
                  - cid
                  - bdate
                  - gen
              config:
                severity: warn
      - name: erp_loc_a101
        identifier: erp_loc_a101
        columns:
          - name: cntry
            data_tests:
            - dbt_expectations.expect_column_distinct_count_to_equal:
                arguments:
                  value: 7
                  config:
                    tags: [ 'test2' ]
                    severity: warn
            - dbt_expectations.expect_column_values_to_match_regex:
                arguments:
                  regex: '\w+'
                  config:
                    severity: warn
      - name: erp_px_cat_g1v2
        identifier: erp_px_cat_g1v2
        data_tests:
           # dwa testy:
           # /tests/compare_dynamic_columns_erp_px_cat_g1v2.sql -- leci po ref()
           # /macros/tests/test_compare_dynamic_columns.sql
          - mac_compare_dynamic_columns:
              arguments:
                compare_to_relation: "ref('erp_px_cat_g1v2')"
                exclude_columns: [ 'X maintenance' ]
              config:
                severity: warn