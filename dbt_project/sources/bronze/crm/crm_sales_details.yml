version: 2
sources:
  - name: bronze
    schema: bronze
    tables:
      - name: crm_sales_details
        description: >
          SOURCE DEFINITION
          Bronze layer: raw CRM customer data imported
          into PostgreSQL without dbt transformations.
        identifier: crm_sales_details
        columns:
          - name: sls_price
            data_tests:
              - dbt_expectations.expect_column_quantile_values_to_be_between:
                  arguments:
                    quantile: .95
                    min_value: 0
                    max_value: 200
                  config:
                    severity: warn