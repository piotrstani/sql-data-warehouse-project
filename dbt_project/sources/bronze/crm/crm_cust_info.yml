version: 2
sources:
  - name: bronze
    schema: bronze
    tables:
      - name: crm_cust_info
        description: "CRM source system"
        identifier: crm_cust_info
        loaded_at_field: cst_create_date::timestamp
        freshness:
          warn_after: {count: 1, period: day}
          error_after: {count: 5, period: day}
        columns:
          - name: cst_id
            data_type: integer
            description: 'Unique numerical identifier assigned to each customer'
          - name: cst_key
            data_type: varchar(50)
            description: 'Alphanumeric identifier representing the customer'
            data_tests:
              - relationships:
                  arguments:
                    to: ref('erp_cust_az12', v=1)
                    field: cid
                  config:
                    severity: warn