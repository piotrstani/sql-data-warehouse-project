version: 2
sources:
  - name: bronze
    schema: bronze
    tables:
      - name: erp_cust_az12
        description: >
          SOURCE DEFINITION
          Bronze layer: raw ERP customer data imported
          into PostgreSQL without dbt transformations.
        identifier: erp_cust_az12
        data_tests:
          - dbt_utils.equality:
              arguments:
                # Wskazujesz tabelę/model referencyjny do porównania
                compare_model: "ref('erp_cust_az12')"
                # Wskazujesz tylko te kolumny, których wartości chcesz sprawdzić
                compare_columns:
                  - cid
                  - bdate
                  - gen
              config:
                severity: warn